# Rwaresto — reverse proxy nginx
# À installer uniquement APRÈS avoir obtenu le certificat TLS.
# Adapter les chemins si votre nginx n'utilise pas /var/www/certbot.
#
# 1) cp deploy/nginx/rwaresto.rwazap.com.conf /etc/nginx/sites-available/rwaresto.rwazap.com.conf
# 2) ln -s /etc/nginx/sites-available/rwaresto.rwazap.com.conf /etc/nginx/sites-enabled/
# 3) nginx -t && systemctl reload nginx

server {
    server_tokens off;
    listen 80;
    listen [::]:80;
    server_name rwaresto.rwazap.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    server_tokens off;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rwaresto.rwazap.com;

    ssl_certificate     /etc/letsencrypt/live/rwaresto.rwazap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rwaresto.rwazap.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:rwaresto_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 12m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";

    # Server-Sent Events : ne pas bufferiser, garder la connexion ouverte.
    location = /api/admin/events {
        proxy_pass http://127.0.0.1:3107;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/orders/[^/]+/events$ {
        proxy_pass http://127.0.0.1:3107;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_read_timeout 60s;
    }
}
